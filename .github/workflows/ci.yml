name: tests

# The point of this file: `probeinfra controls` exits non-zero when a control
# fails, and the pooling arithmetic is pinned on hand-built tensors that need no
# model. So the checks that decide whether a probe number is readable run on
# every push, on CPU, in under a minute.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch — no GPU needed for any test)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Offline tests — cache keys, pooling arithmetic, controls
        run: pytest tests/ -q -m "not slow"
      - name: Dataset-fact tests — pin the numbers the README quotes
        run: pytest tests/ -q -m slow
